services:
  app:
    build: .
    ports: ["127.0.0.1:3000:3000"]
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-0}
      APP_ORIGIN: ${APP_ORIGIN:-http://127.0.0.1:3000}
      DB_DRIVER: ${DB_DRIVER:-sqlite}
      DB_HOST: ${DB_DRIVER:-sqlite}
      DB_NAME: ${DB_NAME:-mangotek}
      DB_USER: ${DB_USER:-mangotek}
      DB_PASSWORD: ${DB_PASSWORD:-}
      SQLITE_PATH: /app/data/portal.sqlite
      UPLOAD_DIR: /app/data/uploads
      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_REGION: ${S3_REGION:-}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_PREFIX: ${S3_PREFIX:-uploads}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-false}
    volumes: ["portal_data:/app/data"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
  postgres:
    image: postgres:17-bookworm
    profiles: [postgres]
    environment:
      POSTGRES_DB: ${DB_NAME:-mangotek}
      POSTGRES_USER: ${DB_USER:-mangotek}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-}
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
  mariadb:
    image: mariadb:11.4
    profiles: [mariadb]
    environment:
      MARIADB_DATABASE: ${DB_NAME:-mangotek}
      MARIADB_USER: ${DB_USER:-mangotek}
      MARIADB_PASSWORD: ${DB_PASSWORD:-}
      MARIADB_RANDOM_ROOT_PASSWORD: "1"
    volumes: ["mariadb_data:/var/lib/mysql"]
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
volumes:
  portal_data:
  postgres_data:
  mariadb_data:
